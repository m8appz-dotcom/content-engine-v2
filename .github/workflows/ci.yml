name: Content Engine v2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: content-engine-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      SOURCE_REGISTRY_PATH: ./content-engine-v2-source-map.md
      DATABASE_PATH: ./data/ci/content-engine-v2.sqlite
      OUTPUTS_PATH: ./outputs/ci
      CONTENT_ENGINE_AI_MODE: deterministic_fallback
      CONTENT_ENGINE_GPT55_MODEL: openai-codex/gpt-5.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Prepare renderer browser
        run: node --input-type=module -e "import {ensureBrowser} from '@remotion/renderer'; await ensureBrowser();"

      - name: Tests
        run: npm test

      - name: Migrate smoke
        run: npm run migrate

      - name: Source registry smoke
        run: npm run smoke

      - name: Eval suite
        run: npm run eval

      - name: Reproduce portfolio walkthrough
        run: npm run demo

      - name: Build
        run: npm run build

      - name: Dependency audit (all packages)
        run: npm audit --audit-level=low

      - name: Publish current evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-engine-evaluation-${{ github.sha }}
          path: |
            evals/reports/current.json
            docs/examples
          if-no-files-found: error
